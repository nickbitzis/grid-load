name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  backtest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Backtest gate (day-ahead MAPE vs same hour last week, P10-P90 coverage 75% to 85%)
        run: |
          uv run --python 3.12 gridload backtest --quick --gate \
            --markdown "$GITHUB_STEP_SUMMARY" --json data/ci/backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: data/ci/backtest.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grid-load:ci .
      - name: Smoke test the API
        run: |
          docker run -d --name grid -p 8856:8856 grid-load:ci
          for i in $(seq 1 90); do curl -sf http://localhost:8856/healthz && break; sleep 2; done
          curl -sf "http://localhost:8856/api/forecast?zone=metro&horizon=day"
          curl -sf http://localhost:8856/api/peak-alert
          curl -sf http://localhost:8856/metrics | grep gridload_backtest_mape
          docker logs grid | tail -5
          docker rm -f grid
